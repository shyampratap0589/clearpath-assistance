
name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clearpath-assistance-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
            - name: Find build output
        run: |
          echo "Current folder:"
          pwd
          echo "Files and folders:"
          ls -la
          echo "Build output folders:"
          find . -maxdepth 5 -type d \( -name dist -o -name client -o -name build \)
        run: bun run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Find build output
        run: |
          pwd
          ls -la
          find . -maxdepth 5 -type d -name client
          find . -maxdepth 4 -type d -name dist
      - name: Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
